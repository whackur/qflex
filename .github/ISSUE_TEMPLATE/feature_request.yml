name: Feature request
description: Propose a change to QFlex.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Search existing issues before submitting a request."
  - type: textarea
    id: goal
    attributes:
      label: User goal
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should QFlex do?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Share a concrete example or workflow that would help evaluate the request.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
