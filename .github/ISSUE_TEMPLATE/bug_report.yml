name: Bug report
description: Report a reproducible problem with a released QFlex runtime.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use this form for a released QFlex runtime. Do not include credentials, cookies, tokens, or private page content."
  - type: input
    id: version
    attributes:
      label: QFlex version
      description: Which release are you using?
      placeholder: "0.1.6"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime environment
      description: Include your operating system and MCP client.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Remove credentials, cookies, tokens, and private page content before sharing.
      render: text
    validations:
      required: false
